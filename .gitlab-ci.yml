stages:
  - build
  - docker

variables:
  PNPM_CACHE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# ==============================================================================
# Job 1: Build Next.js Standalone Application
# ==============================================================================
build-app:
  stage: build
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - npm install -g pnpm@10.30.3
    - pnpm config set store-dir "$PNPM_CACHE_DIR"
  script:
    - pnpm install --frozen-lockfile
    - pnpm nx run @zitadel/proto:generate || true
    - pnpm nx run @zitadel/client:build
    - pnpm nx run @zitadel/login:build
  artifacts:
    paths:
      - apps/login/.next/standalone
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "custom-ui" || $CI_COMMIT_BRANCH == "custom-login-ui"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# Job 2: Build & Push Docker Image
# ==============================================================================
docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      echo "Building Docker image..."
      docker build \
        -f apps/login/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/zitadel-login:$CI_COMMIT_REF_SLUG" \
        -t "$CI_REGISTRY_IMAGE/zitadel-login:latest" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        apps/login

      echo "Pushing Docker image to GitLab Container Registry..."
      docker push "$CI_REGISTRY_IMAGE/zitadel-login:$CI_COMMIT_REF_SLUG"
      docker push "$CI_REGISTRY_IMAGE/zitadel-login:latest"
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      docker push "$CI_REGISTRY_IMAGE:latest"

      # Optional push to GitHub Container Registry (GHCR) if secrets are set in GitLab CI/CD Variables
      if [ -n "$GHCR_TOKEN" ] && [ -n "$GHCR_USER" ]; then
        echo "Pushing Docker image to GitHub Container Registry (ghcr.io)..."
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
        docker tag "$CI_REGISTRY_IMAGE/zitadel-login:$CI_COMMIT_REF_SLUG" "ghcr.io/$GHCR_USER/zitadel-login:$CI_COMMIT_REF_SLUG"
        docker tag "$CI_REGISTRY_IMAGE/zitadel-login:latest" "ghcr.io/$GHCR_USER/zitadel-login:latest"
        docker push "ghcr.io/$GHCR_USER/zitadel-login:$CI_COMMIT_REF_SLUG"
        docker push "ghcr.io/$GHCR_USER/zitadel-login:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "custom-ui" || $CI_COMMIT_BRANCH == "custom-login-ui"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

