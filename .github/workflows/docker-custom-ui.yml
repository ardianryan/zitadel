name: Build and Push Custom Login UI Docker Image

on:
  push:
    branches:
      - custom-ui
      - custom-login-ui
    paths:
      - "apps/login/**"
      - "packages/**"
      - "proto/**"
      - ".github/workflows/docker-custom-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zitadel-login

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Proto and Build Packages
        run: |
          pnpm nx run @zitadel/proto:generate || true
          pnpm nx run @zitadel/client:build


      - name: Build Next.js Standalone Application
        run: pnpm nx run @zitadel/login:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image_name
        run: echo "IMAGE_LOWERCASE=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.IMAGE_LOWERCASE }}:custom-ui
            ${{ steps.image_name.outputs.IMAGE_LOWERCASE }}:latest
          labels: |
            org.opencontainers.image.title=ZITADEL Custom Login UI (Edu-Variant)
            org.opencontainers.image.description=Custom Login UI for ZITADEL with Edu-Variant theme and Gravatar integration
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
